<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>退院支援ナビ v0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Yu Gothic",Meiryo,sans-serif;background:#f3f6fa;color:#203040}
header{height:64px;background:#173b63;color:white;display:flex;align-items:center;padding:0 22px;font-size:20px;font-weight:700}
nav{position:fixed;top:64px;bottom:0;width:220px;background:white;border-right:1px solid #d9e2ec;padding:14px 10px}
nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:7px;margin-bottom:4px;cursor:pointer}
nav button.active,nav button:hover{background:#e8f1fa;color:#145da0;font-weight:bold}
main{margin-left:220px;padding:24px}.screen{display:none}.screen.active{display:block}
h1{margin:0 0 6px;font-size:24px}.sub{color:#66788a;font-size:13px}
.card,.searchbox,.result,.detail{background:white;border:1px solid #dce5ee;border-radius:10px;padding:17px;box-shadow:0 1px 3px #e2e8ee}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.num{font-size:29px;font-weight:bold;margin-top:7px}.green{color:#237a3b}.red{color:#b3261e}.blue{color:#145da0}
.searchbox{margin-top:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.field select,.field input{width:100%;padding:9px;border:1px solid #b9c8d6;border-radius:6px}
.title{font-size:14px;font-weight:bold;margin:14px 0 7px}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{font-size:12px;background:#f5f8fa;padding:7px 9px;border-radius:6px}
.primary,.secondary{border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:bold;margin-top:15px}.primary{background:#1d6fa5;color:white;border:0}.secondary{background:white;color:#1d6fa5;border:1px solid #1d6fa5}
.results{display:grid;gap:12px;margin-top:14px}.result{display:grid;grid-template-columns:55px 1fr 150px;gap:12px;align-items:center}.rank{font-size:25px;font-weight:bold;text-align:center;color:#315d82}.facility{font-size:17px;font-weight:bold}.tags span{display:inline-block;background:#edf5fb;border-radius:999px;padding:4px 8px;margin:5px 4px 0 0;font-size:10px}.distance{color:#145da0;font-weight:bold}.match strong{font-size:19px}.update{font-size:11px;color:#63788b;margin-top:5px}
.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detailrow{padding:9px;border-bottom:1px solid #edf1f4;font-size:13px}.detailrow b{display:inline-block;width:160px}
table{width:100%;border-collapse:collapse;background:white;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #e5ebf0;text-align:left;font-size:12px}th{background:#eef4f8}
.badge{padding:4px 7px;border-radius:999px;font-size:10px;font-weight:bold}.ok{background:#e6f4ea;color:#237a3b}.warn{background:#fff3cd;color:#8a6100}.bad{background:#fde8e7;color:#b3261e}
@media(max-width:800px){nav{width:68px}nav button{font-size:0;text-align:center}main{margin-left:68px;padding:14px}.cards,.grid{grid-template-columns:1fr 1fr}.result{grid-template-columns:45px 1fr}.result>div:last-child{grid-column:2}.detailgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>🏥 退院支援ナビ <span style="font-size:11px;font-weight:normal;margin-left:12px;opacity:.8">Prototype v0.2 / ダミーデータ</span></header>
<nav>
<button class="active" onclick="show('home',this)">🏠 ホーム</button>
<button onclick="show('search',this)">🔎 施設検索</button>
<button onclick="show('update',this)">✏️ 空床更新</button>
<button onclick="show('dashboard',this)">📊 更新状況</button>
</nav>
<main>
<section id="home" class="screen active">
<h1>ホーム</h1><div class="sub">患者さんの条件に合う退院先候補を検索します。</div>
<div class="cards"><div class="card">空床あり<div class="num green">12</div></div><div class="card">本日更新<div class="num blue">8</div></div><div class="card">要確認<div class="num red">4</div></div><div class="card">登録施設<div class="num">128</div></div></div>
<div class="card" style="margin-top:16px"><b>まず何をしますか？</b><br><button class="primary" onclick="show('search',document.querySelectorAll('nav button')[1])">施設を検索する</button><button class="secondary" onclick="show('update',document.querySelectorAll('nav button')[2])" style="margin-left:8px">空床を更新する</button></div>
</section>

<section id="search" class="screen">
<h1>施設検索</h1><div class="sub">介護・生活・医療・施設種別を組み合わせて検索できます。</div>
<div class="searchbox">
<div class="title">介護・生活</div><div class="grid">
<div class="field"><label>希望地域</label><select id="area"><option value="">指定なし</option><option>小牧市</option><option>春日井市</option><option>犬山市</option></select></div>
<div class="field"><label>介護度</label><select id="care"><option value="">指定なし</option><option>要支援1</option><option>要支援2</option><option>要介護1</option><option>要介護2</option><option>要介護3</option><option>要介護4</option><option>要介護5</option></select></div>
<div class="field"><label>認定状況</label><select id="cert"><option value="">指定なし</option><option>認定済み</option><option>認定待ち</option><option>申請予定</option><option>区分変更中</option></select></div>
<div class="field"><label>月額予算</label><select id="budget"><option value="">指定なし</option><option value="15">15万円以内</option><option value="18">18万円以内</option><option value="20">20万円以内</option><option value="25">25万円以内</option></select></div>
</div>
<div class="checks">
<label><input type="checkbox" class="patient" value="認知症"> 認知症</label>
<label><input type="checkbox" class="patient" value="認知症重度"> 認知症重度</label>
<label><input type="checkbox" class="patient" value="身元保証人なし"> 身元保証人なし</label>
<label><input type="checkbox" class="patient" value="生活保護"> 生活保護</label>
<label><input type="checkbox" class="patient" value="感染症あり"> 感染症あり</label>
</div>
<div class="title">施設種別</div><div class="checks">
<label><input type="checkbox" class="type" value="ナーシング"> ナーシング</label><label><input type="checkbox" class="type" value="住宅型"> 住宅型</label><label><input type="checkbox" class="type" value="サ高住"> サ高住</label><label><input type="checkbox" class="type" value="特養"> 特養</label><label><input type="checkbox" class="type" value="老健"> 老健</label><label><input type="checkbox" class="type" value="小多機"> 小多機</label><label><input type="checkbox" class="type" value="看多機"> 看多機</label>
</div>
<div class="title">医療・看護</div><div class="checks">
<label><input type="checkbox" class="medical" value="バルン"> バルン</label><label><input type="checkbox" class="medical" value="点滴"> 点滴</label><label><input type="checkbox" class="medical" value="CV/PICC"> CV/PICC</label><label><input type="checkbox" class="medical" value="胃ろう"> 胃ろう</label><label><input type="checkbox" class="medical" value="吸引"> 吸引</label><label><input type="checkbox" class="medical" value="酸素"> 酸素</label><label><input type="checkbox" class="medical" value="透析"> 透析</label><label><input type="checkbox" class="medical" value="看取り"> 看取り</label><label><input type="checkbox" class="medical" value="24時間看護"> 24時間看護</label>
</div>
<div class="title">空床・距離</div><div class="grid">
<div class="field"><label>空床</label><select id="vacancy"><option value="">指定なし</option><option value="1">空床あり</option></select></div>
<div class="field"><label>距離の基準</label><select><option>小牧市民病院から</option><option>患者自宅から</option></select></div>
<div class="field"><label>表示順</label><select><option>距離が近い順</option><option>一致率順</option><option>費用が安い順</option></select></div>
</div>
<button class="primary" onclick="search()">🔎 条件で検索</button>
</div><div id="results" class="results"></div>
</section>

<section id="detail" class="screen"><h1>施設詳細</h1><div id="detailBox" class="detail"></div></section>
<section id="update" class="screen"><h1>空床・施設情報更新</h1><div class="searchbox"><div class="grid"><div class="field"><label>施設名</label><select><option>○○ナーシングホーム</option><option>△△住宅型ホーム</option><option>□□サ高住</option><option>××看多機</option></select></div><div class="field"><label>空床数</label><select><option>0</option><option>1</option><option>2</option><option>3以上</option></select></div><div class="field"><label>更新者</label><input placeholder="例：ひかる"></div><div class="field"><label>確認日</label><input type="date"></div></div><button class="primary" onclick="alert('試作品：保存ボタンが動作しました。')">保存する</button></div></section>
<section id="dashboard" class="screen"><h1>更新状況</h1><table><tr><th>施設</th><th>種別</th><th>空床</th><th>最終更新</th><th>状況</th></tr><tr><td>○○ナーシングホーム</td><td>ナーシング / 住宅型</td><td>2</td><td>2026/8/19</td><td><span class="badge ok">今日更新</span></td></tr><tr><td>△△住宅型ホーム</td><td>住宅型</td><td>1</td><td>2026/8/16</td><td><span class="badge warn">3日前</span></td></tr><tr><td>□□サ高住</td><td>サ高住</td><td>0</td><td>2026/7/30</td><td><span class="badge bad">要確認</span></td></tr></table></section>
</main>
<script>
const fs=[
{name:"○○ナーシングホーム",area:"小牧市",care:["要介護1","要介護2","要介護3","要介護4","要介護5"],cert:["認定済み","認定待ち"],budget:18,vacancy:2,distance:3.2,types:["ナーシング","住宅型"],patient:["認知症","認知症重度","身元保証人なし","生活保護","感染症あり"],medical:["バルン","点滴","CV/PICC","胃ろう","吸引","酸素","看取り","24時間看護"],person:"山田さん",tel:"000-0000-0000",note:"認定待ちの暫定受け入れは要相談。"},
{name:"△△住宅型ホーム",area:"春日井市",care:["要支援2","要介護1","要介護2","要介護3","要介護4"],cert:["認定済み"],budget:15,vacancy:1,distance:6.4,types:["住宅型"],patient:["認知症","生活保護"],medical:["バルン","胃ろう","酸素","看取り"],person:"佐藤さん",tel:"000-0000-0001",note:"家族対応が丁寧。"},
{name:"□□サ高住",area:"犬山市",care:["要介護2","要介護3","要介護4","要介護5"],cert:["認定済み","認定待ち"],budget:20,vacancy:0,distance:8.1,types:["サ高住"],patient:["認知症"],medical:["点滴","吸引","酸素","24時間看護"],person:"田中さん",tel:"000-0000-0002",note:"医療対応は事前相談。"},
{name:"××看多機",area:"小牧市",care:["要支援2","要介護1","要介護2","要介護3","要介護4","要介護5"],cert:["認定済み","認定待ち"],budget:12,vacancy:3,distance:4.7,types:["看多機"],patient:["認知症","身元保証人なし"],medical:["バルン","点滴","胃ろう","吸引","酸素"],person:"鈴木さん",tel:"000-0000-0003",note:"認定待ちの暫定利用は要相談。"}
];
function show(id,b){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active")}
function search(){let a=document.getElementById("area").value,c=document.getElementById("care").value,ce=document.getElementById("cert").value,bu=document.getElementById("budget").value,v=document.getElementById("vacancy").value,p=[...document.querySelectorAll(".patient:checked")].map(x=>x.value),t=[...document.querySelectorAll(".type:checked")].map(x=>x.value),m=[...document.querySelectorAll(".medical:checked")].map(x=>x.value);let r=fs.filter(f=>(!a||f.area===a)&&(!c||f.care.includes(c))&&(!ce||f.cert.includes(ce))&&(!bu||f.budget<=+bu)&&(!v||f.vacancy>0)&&p.every(x=>f.patient.includes(x))&&(!t.length||t.some(x=>f.types.includes(x)))&&m.every(x=>f.medical.includes(x))).sort((x,y)=>x.distance-y.distance);document.getElementById("results").innerHTML=r.length?r.map((f,i)=>`<div class="result"><div class="rank">${i+1}</div><div><div class="facility">${f.name}</div><div class="tags">${[...f.types,...f.medical].map(x=>`<span>${x}</span>`).join("")}</div><div class="update">空床 ${f.vacancy} / 最終更新 ${f.distance===3.2?"今日":"3日前"}</div></div><div><div class="distance">📍 ${f.distance} km</div><div class="match">一致率 <strong>${98-i*4}%</strong></div><button class="secondary" onclick="detail('${f.name}')">詳細</button></div></div>`).join(""):"<div class='card'>条件に合う施設はありません。</div>"}
function detail(n){let f=fs.find(x=>x.name===n);document.getElementById("detailBox").innerHTML=`<h2>${f.name}</h2><div class="sub">${f.area} / ${f.types.join("・")}</div><div class="detailgrid"><div class="detailrow"><b>相談員</b>${f.person}</div><div class="detailrow"><b>電話</b>${f.tel}</div><div class="detailrow"><b>月額目安</b>${f.budget}万円以内</div><div class="detailrow"><b>空床</b>${f.vacancy}</div><div class="detailrow"><b>小牧市民病院から</b>${f.distance} km</div><div class="detailrow"><b>介護度</b>${f.care.join(" / ")}</div><div class="detailrow"><b>認定待ち</b>${f.cert.includes("認定待ち")?"暫定受け入れ要相談":"対応情報なし"}</div></div><h3>生活・受入条件</h3><div class="tags">${f.patient.map(x=>`<span>${x}</span>`).join("")}</div><h3>医療・看護対応</h3><div class="tags">${f.medical.map(x=>`<span>${x}</span>`).join("")}</div><p>${f.note}</p><button class="secondary" onclick="show('search',document.querySelectorAll('nav button')[1])">検索へ戻る</button>`;show("detail")}
search();
</script></body></html>
